<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smith Chart Solver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>window.MathJax = { tex: { inlineMath: [['\\(', '\\)']] }, svg: { fontCache: 'global' } };</script>
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="16.5" cy="12" r="4.5"/><path d="M3 12h18"/></svg>
      <span class="brand-name">Smith Chart Solver</span>
      <span class="brand-sub">Kỹ thuật Siêu cao tần · Chương 2</span>
    </div>
    <nav id="modules" class="tabs" role="tablist" aria-label="Dạng bài"></nav>
  </header>

  <main class="app">
    <div class="col-input">
      <form id="form" class="card" novalidate>
        <h2>Đề bài</h2>
        <div id="fields" class="fields"></div>
        <button type="submit" class="btn-primary">Giải bài</button>
      </form>
    </div>

    <section class="card chart-card" aria-label="Giản đồ Smith">
      <div class="card-head">
        <div id="solutions" class="segmented" role="tablist" aria-label="Chọn nghiệm"></div>
        <div class="tools">
          <button type="button" id="zoom-out" class="icon-btn" aria-label="Thu nhỏ" title="Thu nhỏ">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <button type="button" id="zoom-in" class="icon-btn" aria-label="Phóng to" title="Phóng to (càng zoom càng hiện lưới chi tiết)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button type="button" id="reset" class="icon-btn" aria-label="Xem toàn bộ giản đồ" title="Xem toàn bộ giản đồ">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          </button>
          <button type="button" id="print" class="icon-btn" aria-label="In lời giải" title="In lời giải">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/></svg>
          </button>
        </div>
      </div>
      <svg id="smith" role="img" aria-label="Giản đồ Smith với đường giải"></svg>
      <ul id="legend" class="legend" aria-label="Các điểm trên giản đồ"></ul>
      <p id="readout" class="readout" aria-live="off"></p>
    </section>

    <div class="col-output">
      <section class="card print-only problem-card">
        <h2>Đề bài</h2>
        <p id="problem" class="problem"></p>
      </section>
      <section class="card answers" aria-live="polite" aria-labelledby="ans-title">
        <div class="card-head">
          <h2 id="ans-title">Đáp số</h2>
          <span id="sol-name" class="tag"></span>
        </div>
        <div id="error" class="error" role="alert" hidden></div>
        <dl id="answers" class="answer-list"></dl>
      </section>
    </div>

    <section class="card steps-card" aria-labelledby="steps-title">
      <div class="card-head">
        <h2 id="steps-title">Lời giải từng bước</h2>
        <span class="hint">Chọn một bước để xem trên giản đồ</span>
      </div>
      <ol id="steps" class="steps"></ol>
    </section>
  </main>

  <script src="js/complex.js"></script>
  <script src="js/rf.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
